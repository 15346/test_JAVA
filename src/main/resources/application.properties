# ============================================================
#  服务配置
#  （本机 8080 常被 Jenkins 等占用，这里用 8081）
# ============================================================
spring.application.name=demo
server.port=8081

# ============================================================
#  H2 内存数据库配置（当前未使用，已改用 MySQL；想切回把下面 4 行的 # 去掉、
#  并注释掉下面 MySQL 那组即可）
# ============================================================
#spring.datasource.url=jdbc:h2:mem:demo
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=



# ============================================================
#  MySQL 数据库配置
#  - demo 是数据库名；createDatabaseIfNotExist=true 表示库不存在时自动建
#  - characterEncoding=utf8 保证中文不乱码；serverTimezone 按你所在地填
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/demo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456


# ============================================================
#  JPA / Hibernate 配置
# ============================================================
# 启动时根据实体类自动建/更新表结构
spring.jpa.hibernate.ddl-auto=update
# 控制台打印实际执行的 SQL，方便观察后端到底做了什么
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 让 data.sql 在 Hibernate 建表之后再执行（否则建表前插入会失败）
spring.jpa.defer-datasource-initialization=true
# always=每次启动都执行 data.sql（会累积重复）；never=只在首次需要时手动启用
# MySQL 是持久库，这里设 never，避免每次重启都重复插入初始数据
spring.sql.init.mode=never

# ============================================================
#  H2 Web 控制台：启动后浏览器访问 http://localhost:8081/h2-console
#  连接时 JDBC URL 填上面的 jdbc:h2:mem:demo，用户名 sa，密码留空
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
